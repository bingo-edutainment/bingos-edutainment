<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Talk to Bingo</title>
  <link rel="stylesheet" href="style.css">
</head>

<body class="call-page">

  <main class="call-container">

    <!-- Main title -->
    <h1 class="call-title rainbow-title">
      <span>W</span><span>A</span><span>N</span><span>T</span>
      <span>&nbsp;</span>
      <span>T</span><span>O</span>
      <span>&nbsp;</span>
      <span>T</span><span>A</span><span>L</span><span>K</span>
      <span>&nbsp;</span>
      <span>T</span><span>O</span>
      <span>&nbsp;</span>
      <span>B</span><span>I</span><span>N</span><span>G</span><span>O</span><span>?</span>
    </h1>

    <!-- Phone number form -->
    <form id="callForm" class="call-form">

      <label for="phone">Phone Number</label>

      <input
        id="phone"
        name="phone"
        type="tel"
        inputmode="tel"
        autocomplete="tel"
        placeholder="Type your phone number here!"
        required
      >

      <button
        class="call-button"
        type="submit"
        id="callButton"
      >
        CALL ME
      </button>

    </form>

    <!-- Disclaimer -->
    <p class="disclaimer">
      DISCLAIMER: BINGO DOES NOT RECORD YOUR PHONE NUMBER BUT HE MAY CALL YOU BACK : )
    </p>

    <!-- Consent -->
    <label class="consent">
      <input id="consent" type="checkbox" required>
      <span>I consent to Bingo</span>
    </label>

    <!-- Status message -->
    <p id="status" class="status" aria-live="polite"></p>

    <!-- Back to main page -->
    <a href="index.html" class="back-link">
      ← BACK TO MAIN PAGE
    </a>

  </main>

  <script>
    // Replace this with your Cloudflare Worker URL later.
    const API_URL = "https://bingos-call.bingo-caller.workers.dev";

    const form = document.getElementById("callForm");
    const button = document.getElementById("callButton");
    const status = document.getElementById("status");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const phone = document.getElementById("phone").value.trim();
      const consent = document.getElementById("consent");

      if (!consent.checked) {
        status.textContent = "Please confirm that you consent to the call.";
        status.className = "status error";
        return;
      }

      button.disabled = true;
      status.textContent = "Connecting...";
      status.className = "status";

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            phone: phone
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(
            data.error || "Unable to place the call."
          );
        }

        status.textContent =
          "The call is on its way. Answer if you dare.";

        status.className = "status success";

        form.reset();

      } catch (error) {

        status.textContent = error.message;
        status.className = "status error";

      } finally {

        setTimeout(() => {
          button.disabled = false;
        }, 10000);

      }
    });
  </script>

</body>
</html>
